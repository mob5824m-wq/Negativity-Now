name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify product quality rules
        run: python3 scripts/quality_checks.py

  release:
    name: Build and publish APK
    needs: quality
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: "./gradlew --no-daemon :app:assembleDebug"
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "negativity-now-${RELEASE_TAG}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "negativity-now-${RELEASE_TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Negativity Now $RELEASE_TAG" \
            --generate-notes
